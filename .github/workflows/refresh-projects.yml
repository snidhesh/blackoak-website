name: Refresh projects snapshot

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch CRM snapshot
        env:
          CRM_API_BASE_URL: ${{ secrets.CRM_API_BASE_URL }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
        run: npm run snapshot:projects

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- src/data/listings-snapshot.json; then
            echo "Snapshot unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/listings-snapshot.json
            git commit -m "chore: refresh projects snapshot"
            git push
          fi
